name: CI

# Runs on every push and pull request, including the automated data PRs, so a
# reviewer is always looking at a change that already passed the full gate.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The build toolchain (tsdown/rolldown) and the unit tests, which
          # import TypeScript sources directly, both need a modern Node. The
          # published output does not — that is what the compat job proves.
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run size
      - run: npm run verify-pack

      # Hand the exact built output to the compat job rather than rebuilding
      # it there: old Node cannot run the bundler, only the result.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  compat:
    name: Built output on Node ${{ matrix.node-version }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Proves the "engines: node >= 18" claim against the real dist output.
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # No npm install: these tests import only the built output and Node
      # built-ins, which is exactly what a consumer of the package gets.
      - run: node --test tests/*.test.mjs
