name: Update aviation dataset

# Refreshes the generated datasets from upstream and, when — and only when —
# the normalized data actually changed, commits to main, cuts a patch release
# and hands off to release.yml, which is the only workflow that publishes.
#
# No human in the loop. The gate is scripts/validate-data.ts (minimum entry
# counts, code shape, duplicate and shrink guards) followed by the full build,
# test, benchmark, size-regression and pack check below. Any failure leaves the
# last known-good dataset committed and nothing is tagged.
on:
  schedule:
    # OurAirports regenerates its dump nightly; Wikidata changes continuously.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Dispatching release.yml at the new tag.
      actions: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch, validate and regenerate
        id: update
        run: npm run update-data

      - name: Stop early when the dataset is unchanged
        if: steps.update.outputs.changed != 'true'
        run: echo "Upstream matches the committed dataset. Nothing to do."

      # Everything below only runs when real changes landed.
      - name: Build
        if: steps.update.outputs.changed == 'true'
        run: npm run build

      - name: Test
        if: steps.update.outputs.changed == 'true'
        run: npm test

      - name: Benchmark
        if: steps.update.outputs.changed == 'true'
        run: npm run benchmark

      # Gate first against the committed baseline, then move the baseline forward
      # in the same commit so the next run measures against these numbers.
      - name: Check size regression
        if: steps.update.outputs.changed == 'true'
        run: npm run size

      - name: Verify package contents
        if: steps.update.outputs.changed == 'true'
        run: npm run verify-pack

      - name: Compose release notes
        if: steps.update.outputs.changed == 'true'
        id: body
        run: node scripts/release-notes.ts >> "$GITHUB_OUTPUT"

      - name: Refresh size baseline
        if: steps.update.outputs.changed == 'true'
        run: npm run size -- --update

      - name: Commit, tag and release
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Via env, not ${{ }} inside run: the notes are upstream-derived text
          # and must never be pasted into a shell command.
          DATE: ${{ steps.body.outputs.date }}
          NOTES: ${{ steps.body.outputs.summary }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add generated/ src/airports.data.ts src/airlines.data.ts size-baseline.json
          git commit -m "chore(data): update aviation dataset $DATE"

          # Aborts on a dirty tree, which is the failure mode we want: nothing
          # gets tagged if a build step left something unexpected behind.
          npm version patch -m "chore(release): %s"
          tag="v$(node -p "require('./package.json').version")"

          git push --follow-tags origin main
          printf '%s\n' "$NOTES" | gh release create "$tag" --title "$tag" --notes-file -

          # This release will NOT fire `release: published` — GitHub suppresses
          # that for anything created with GITHUB_TOKEN. workflow_dispatch is the
          # documented exception, so publishing is kicked off explicitly, at the
          # tag rather than a branch. See the comment at the top of release.yml.
          gh workflow run release.yml --ref "$tag"
          echo "Dispatched release.yml at $tag"
