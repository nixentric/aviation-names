name: Release

# The only workflow that publishes. Two ways in, one gate:
#   - a human cuts a GitHub release, or
#   - update-data.yml dispatches this at the v* tag it just pushed.
#
# The dispatch trigger exists because a release created with GITHUB_TOKEN does
# not fire `release: published` — workflow_dispatch is the documented exception
# to that rule. Dispatching at the tag (not a branch) keeps GITHUB_REF_NAME a
# version tag, which is what the version check below and the `release`
# environment's `v*` tag policy both expect.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: read
      # Required for npm Trusted Publishing. No NPM_TOKEN secret exists in this
      # repository; the registry trusts this workflow's short-lived OIDC token.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node >= 22.14.0.
          node-version: 22
          cache: npm
          # registry-url is deliberately NOT set, and must not be re-added.
          #
          # It makes setup-node write an .npmrc containing
          #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          # With no NODE_AUTH_TOKEN secret — the whole point of trusted
          # publishing — that expands to an empty token, but npm still sees
          # _authToken as configured, skips the OIDC exchange entirely, and
          # PUTs unauthenticated. The registry answers 404/permission denied.
          # Leaving it unset means npm finds no credentials, detects the OIDC
          # environment, and exchanges the id-token for a short-lived one.
          # npmjs.org is the default registry, so nothing else is needed.

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      - name: Verify the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "Publishing version $version"

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

      - run: npm run benchmark

      - name: Check size regression
        run: npm run size

      - name: Verify package contents
        run: npm run verify-pack

      - name: Publish to npm
        # No NODE_AUTH_TOKEN: the npm CLI detects the OIDC environment and
        # exchanges the id-token for a short-lived publish credential.
        # Provenance is attested automatically.
        #
        # --verbose so an auth failure shows whether the OIDC exchange was
        # attempted and what the registry said, rather than a bare ENEEDAUTH.
        run: npm publish --verbose
